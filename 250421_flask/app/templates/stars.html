<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>별찍기</title>
  </head>
  <body>
    <p>나랑 별 보러 가지 않을래?</p>
    <p>입력한 별의 수 : {{n}}</p>
    {% for i in range(1, n + 1) %}
    <p>{{ '*' * i }}</p>
    {% endfor %}
  </body>
</html>
